<style>

const K=[['gmv',t('gmv'),k(cur.gmv),d(cur.gmv,prev.gmv),sl.map(x=>x.gmv),'#FF6B5B'],['net',t('net')+' · 18% '+t('take'),k(cur.net),d(cur.net,prev.net),sl.map(x=>x.gmv*.15),'#FFC857'],['bk',t('bk'),cur.bk.toLocaleString(),d(cur.bk,prev.bk),sl.map(x=>x.bk),'#2EC4B6'],['pros',t('pros'),cur.pros,d(cur.pros,prev.pros),sl.map((x,i)=>i),'#5AA9FF']];
const tot=cur.bk;
$('#v-overview').innerHTML=`<div class="kpis">${K.map(x=>`<button class="kpi ${kpiSel===x[0]?'on':''}" onclick="kpiSel='${x[0]}';render()"><small>${x[1]}</small><b>${x[2]}</b>${x[3]}${spark(x[4],x[5])}</button>`).join('')}</div>
<div class="grid"><div class="card"><div class="ch"><h3>${t('gmvTrend')}</h3><small>· ${range}D</small></div><div class="chart" id="chart"></div></div>
<div class="card"><div class="ch"><h3>${t('feed')}</h3><span class="sp"></span><span class="live"><i></i></span></div><div class="feed" id="feed"></div></div></div>
<div class="grid"><div class="card"><div class="ch"><h3>${t('byService')}</h3><small>· ${tot.toLocaleString()}</small></div><div class="bars">${SERV.map(s=>{const n=Math.round(tot*s[3]);return `<div class="r"><span>${L==='es'?s[1]:s[0]}</span><span class="t"><i style="width:${s[3]/.22*100}%;background:${s[2]}"></i></span><span class="v">${n}</span></div>`}).join('')}</div></div>
<div class="card"><div class="ch"><h3>${t('health')}</h3></div><div class="bars">${[[t('activation'),.68,'68%','#3DDC97'],[t('repeat'),.41,'41%','#2EC4B6'],[t('ttfb'),.55,'2.4 '+t('days'),'#FFC857'],[t('dispRate'),.12,'1.2%','#FF6B5B']].map(r=>`<div class="r"><span>${r[0]}</span><span class="t"><i style="width:${r[1]*100}%;background:${r[3]}"></i></span><span class="v">${r[2]}</span></div>`).join('')}</div>
<div class="ch" style="margin-top:18px"><h3>${t('pipeline')}</h3><span class="sp"></span><button class="btn" onclick="go('vendors')">${t('vendors')} ›</button></div><div class="bars">${STAGES.map(s=>`<div class="r"><span>${t(s)}</span><span class="t"><i style="width:${vendors[s].length/5*100}%;background:${SC[s]}"></i></span><span class="v">${vendors[s].length}</span></div>`).join('')}</div></div></div>`;
drawChart();renderFeed()}
function drawChart(){const el=$('#chart');if(!el)return;const s=series.slice(DAYS-range),W=600,H=220,P=26;const key=kpiSel==='bk'?'bk':'gmv';const vals=s.map(x=>kpiSel==='net'?x.gmv*.1476:kpiSel==='pros'?x.bk:x[key]);const mx=Math.max(...vals)*1.1;const bw=(W-P)/s.length;
const bars=s.map((x,i)=>{const h=x.bk/Math.max(...s.map(y=>y.bk))*(H-P)*.5;return `<rect x="${P+i*bw+bw*.2}" y="${H-P-h}" width="${bw*.6}" height="${h}" rx="2" fill="#2EC4B6" opacity=".22"/>`}).join('');
const pts=vals.map((v,i)=>[P+i*bw+bw/2,H-P-v/mx*(H-P)]);const line=pts.map(p=>p.join(',')).join(' ');
const grid=[0,.25,.5,.75,1].map(g=>`<line x1="${P}" x2="${W}" y1="${(H-P)*(1-g)}" y2="${(H-P)*(1-g)}" stroke="rgba(255,255,255,.05)"/><text x="0" y="${(H-P)*(1-g)+4}" fill="rgba(242,245,251,.35)" font-size="9" font-family="JetBrains Mono">${kpiSel==='bk'||kpiSel==='pros'?Math.round(mx*g):k(Math.round(mx*g))}</text>`).join('');
el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${bars}<defs><linearGradient id="gf" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FF6B5B" stop-opacity=".35"/><stop offset="1" stop-color="#FF6B5B" stop-opacity="0"/></linearGradient></defs><polygon points="${P+bw/2},${H-P} ${line} ${pts[pts.length-1][0]},${H-P}" fill="url(#gf)"/><polyline points="${line}" fill="none" stroke="#FF6B5B" stroke-width="2.4" vector-effect="non-scaling-stroke"/><line id="hl" y1="0" y2="${H-P}" stroke="rgba(255,255,255,.3)" stroke-dasharray="3 3" style="display:none"/></svg><div class="tip" id="tip"></div>`;
const svg=el.querySelector('svg'),tip=$('#tip'),hl=$('#hl');el.onmousemove=e=>{const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W;const i=Math.max(0,Math.min(s.length-1,Math.floor((x-P)/bw)));const d=new Date();d.setDate(d.getDate()-(s.length-1-i));hl.setAttribute('x1',pts[i][0]);hl.setAttribute('x2',pts[i][0]);hl.style.display='';tip.style.display='block';tip.style.left=(pts[i][0]/W*100)+'%';tip.style.top=(pts[i][1]/H*100)+'%';tip.textContent=`${d.toLocaleDateString(L==='es'?'es':'en-US',{month:'short',day:'numeric'})} · ${k(s[i].gmv)} · ${s[i].bk} ${t('bk').toLowerCase()}`};el.onmouseleave=()=>{tip.style.display='none';hl.style.display='none'}}
let feedItems=[];const FEEDT=[['bolt','#FF6B5B',{en:'New booking · {s} in {a} · {m}',es:'Nueva reserva · {s} en {a} · {m}'}],['check','#3DDC97',{en:'{p} completed a job · {m} released',es:'{p} completó un trabajo · {m} liberado'}],['star','#FFC857',{en:'5★ review for {p}',es:'Reseña 5★ para {p}'}],['user','#5AA9FF',{en:'New customer signed up in {a}',es:'Nuevo cliente registrado en {a}'}]];
function feedItem(){const f=FEEDT[Math.floor(Math.random()*FEEDT.length)],s=SERV[Math.floor(Math.random()*SERV.length)];return{f,txt:f[2],vals:{s:s,a:AREAS[Math.floor(Math.random()*AREAS.length)][0],p:PRO[Math.floor(Math.random()*PRO.length)],m:money(90+Math.random()*500)},at:Date.now()}}
for(let i=0;i<9;i++){const x=feedItem();x.at-=i*95000;feedItems.push(x)}
function fmtFeed(x){return (L==='es'?x.txt.es:x.txt.en).replace('{s}',L==='es'?x.vals.s[1]:x.vals.s[0]).replace('{a}',x.vals.a).replace('{p}',x.vals.p).replace('{m}',x.vals.m)}
function ago(ts){const s=Math.round((Date.now()-ts)/1000);return s<60?s+'s':Math.round(s/60)+'m'}
function renderFeed(){const el=$('#feed');if(!el)return;el.innerHTML=feedItems.slice(0,14).map(x=>`<div class="fi"><span class="ic" style="background:${x.f[1]}22;color:${x.f[1]}">${ic(x.f[0])}</span><div><p>${fmtFeed(x)}</p><small>${ago(x.at)}</small></div></div>`).join('')}
setInterval(()=>{feedItems.unshift(feedItem());if(view==='overview')renderFeed()},4200);
/* bookings */
function bookingsV(){let l=bookings.filter(b=>(bf==='all'||b.st===bf)&&(!bq||(b.id+b.cust+b.pro+b.area+b.svc[0]).toLowerCase().includes(bq.toLowerCase())));const [sk,dir]=bsort;l.sort((a,b)=>{const va=sk==='svc'?a.svc[0]:a[sk],vb=sk==='svc'?b.svc[0]:b[sk];return (va>vb?1:va<vb?-1:0)*dir});
const cols=[['id',t('id')],['cust',t('customer')],['pro',t('pro')],['svc',t('service')],['area',t('area')],['amt',t('amount')],['st',t('status')],['ago','']];
$('#v-bookings').innerHTML=`<div class="card"><div class="filters"><input id="bq" placeholder="${t('search')}" value="${bq}" oninput="bq=this.value;bookingsV();const i=$('#bq');i.focus();i.setSelectionRange(i.value.length,i.value.length)" style="flex:1;min-width:180px">${['all','pending','confirmed','onway','done','disputed'].map(s=>`<button class="btn ${bf===s?'p':''}" onclick="bf='${s}';bookingsV()">${s==='all'?t('all'):s}</button>`).join('')}</div>
<div class="tblw"><table><thead><tr>${cols.map(c=>`<th onclick="bsort=['${c[0]}',bsort[0]==='${c[0]}'?-bsort[1]:1];bookingsV()">${c[1]}${bsort[0]===c[0]?(bsort[1]>0?' ↑':' ↓'):''}</th>`).join('')}</tr></thead><tbody>${l.map(b=>`<tr><td class="mono">${b.id}</td><td>${b.cust}</td><td>${b.pro}</td><td><span style="color:${b.svc[2]}">●</span> ${L==='es'?b.svc[1]:b.svc[0]}</td><td>${b.area}</td><td class="mono">${money(b.amt)}</td><td><span class="st s-${b.st}">${b.st}</span></td><td>${b.st!=='done'&&b.st!=='disputed'?`<button class="btn" onclick="adv('${b.id}')">${ic('right')}</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`}
function adv(id){const b=bookings.find(x=>x.id===id),o=['pending','confirmed','onway','done'];b.st=o[Math.min(3,o.indexOf(b.st)+1)];toast(`${id} → ${b.st}`);bookingsV()}
/* vendors */
function vendorsV(){$('#v-vendors').innerHTML=`<div class="card"><div class="ch"><h3>${t('pipeline')}</h3><small>· ${STAGES.reduce((a,s)=>a+vendors[s].length,0)}</small><span class="sp"></span><button class="btn p" onclick="addV()">${t('addVendor')}</button></div>
<div class="kanban">${STAGES.map((s,si)=>`<div class="col" data-s="${s}" ondragover="event.preventDefault();this.classList.add('drop')" ondragleave="this.classList.remove('drop')" ondrop="dropV(event,'${s}')"><h4><span style="color:${SC[s]}">● ${t(s)}</span><span>${vendors[s].length}</span></h4>${vendors[s].map((v,i)=>`<div class="vc" draggable="true" ondragstart="event.dataTransfer.setData('t','${s}|${i}')"><b>${v[0]}</b><small>${v[1]} · ${v[2]}</small><div class="ft">${si>0?`<button onclick="mv('${s}',${i},-1)" aria-label="back">${ic('left')}</button>`:''}<span class="sp"></span>${s==='onboarded'?`<span class="tag" style="background:rgba(61,220,151,.14);color:var(--ok)">0% · 90d</span>`:`<button onclick="mv('${s}',${i},1)" aria-label="next">${ic('right')}</button>`}</div></div>`).join('')}${si===0?`<button class="addv" onclick="addV()">${t('addVendor')}</button>`:''}</div>`).join('')}</div></div>`}
function mv(s,i,d){const ns=STAGES[STAGES.indexOf(s)+d];const v=vendors[s].splice(i,1)[0];vendors[ns].push(v);toast(`${v[0]} · ${t('move')} ${t(ns)}`);vendorsV()}
function dropV(e,ns){e.preventDefault();const [s,i]=e.dataTransfer.getData('t').split('|');if(s===ns)return vendorsV();const v=vendors[s].splice(+i,1)[0];vendors[ns].push(v);toast(`${v[0]} · ${t('move')} ${t(ns)}`);vendorsV()}
function addV(){$('#mbox').innerHTML=`<h3>${t('addVendor').replace('+ ','')}</h3><input id="vn" placeholder="${t('name')}"><select id="vt">${SERV.map(s=>`<option>${L==='es'?s[1]:s[0]}</option>`).join('')}</select><select id="va">${AREAS.map(a=>`<option>${a[0]}</option>`).join('')}</select><div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="$('#modal').classList.remove('on')">${t('cancel')}</button><button class="btn p" style="flex:1" onclick="saveV()">${t('save')}</button></div>`;$('#modal').classList.add('on');setTimeout(()=>$('#vn').focus(),50)}
function saveV(){const n=$('#vn').value.trim();if(!n){$('#vn').focus();return}vendors.identified.unshift([n,$('#vt').value,$('#va').value]);$('#modal').classList.remove('on');toast(t('added'));go('vendors')}
$('#modal').onclick=e=>{if(e.target.id==='modal')e.target.classList.remove('on')};
/* disputes */
function disputesV(){$('#v-disputes').innerHTML=`<div class="card"><div class="ch"><h3>${t('open')}</h3><small>· ${disputes.length}</small></div>${disputes.length?disputes.map((d,i)=>`<div class="disp"><span class="st s-disputed">${d.id}</span><div class="t"><b>${d.cust} ↔ ${d.pro}</b><small>${d.why[L]}</small></div><span class="mono">${money(d.amt)}</span><button class="btn" onclick="resolveD(${i},0)">${t('side')}</button><button class="btn p" onclick="resolveD(${i},1)">${t('resolve')}</button></div>`).join(''):`<p style="color:var(--mut);text-align:center;padding:30px">✓ 0</p>`}</div>`}
function resolveD(i,refund){const d=disputes.splice(i,1)[0];const b=bookings.find(x=>x.id===d.id);if(b)b.st='done';toast(`${d.id} · ${t('resolved')}${refund?' · −'+money(d.amt):''}`);chrome();disputesV()}
/* markets */
function marketsV(){$('#v-markets').innerHTML=`<div class="card"><div class="ch"><h3>${t('supply')}</h3></div><div class="map">${AREAS.map(a=>{const f=Math.min(1,a[1]/(a[2]*1.4));const c=f>.85?'#3DDC97':f>.6?'#FFC857':'#FF6B5B';return `<button class="cell" style="background:${c}14;border-color:${c}55" onclick="toast('${a[0]} · ${Math.round(f*100)}% ${t('fill')}')"><b>${a[0]}</b><small style="color:${c}">${Math.round(f*100)}% ${t('fill')}</small><br><small style="color:var(--mut)">${a[1]} ${t('prosL')} · ${a[2]} ${t('demandL')}</small></button>`}).join('')}</div></div>`}
function render(){chrome();({overview,bookings:bookingsV,vendors:vendorsV,disputes:disputesV,markets:marketsV})[view]()}
document.documentElement.lang=L;if(p.get('view'))view=p.get('view');go(view);
</script>
</body>
</html>
