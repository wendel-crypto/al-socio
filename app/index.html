<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Al Socio — Home services in Miami</title>
<meta name="description" content="Interactive prototype of Al Socio, a bilingual home-services marketplace for Miami: verified pros, upfront pricing, booking, tracking and a neighbourhood community.">
<meta name="theme-color" content="#0A1020">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1020;--bg2:#0E1629;--card:#121B30;--card2:#18233D;--line:rgba(255,255,255,.07);--ink:#F2F5FB;--mut:rgba(242,245,251,.6);--dim:rgba(242,245,251,.38);--coral:#FF6B5B;--coral2:#FF8A6B;--teal:#2EC4B6;--gold:#FFC857;--grad:linear-gradient(135deg,#FF6B5B,#FF9466);--ok:#3DDC97;--blue:#5AA9FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 600px at 70% -10%,#1b2747 0,#070b16 60%);color:var(--ink);font:600 15px/1.4 Nunito,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit;background:none;border:0;padding:0;outline:none}
button{cursor:pointer}
img{display:block}
.mono{font-family:'JetBrains Mono',monospace}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.phone{position:relative;width:390px;height:844px;background:var(--bg);border-radius:48px;overflow:hidden;box-shadow:0 0 0 10px #151c2c,0 0 0 11px #26304a,0 50px 120px rgba(0,0,0,.6)}
body.embed,body.bare{background:var(--bg);display:block}
body.embed .phone,body.bare .phone{width:100%;height:100%;border-radius:0;box-shadow:none}
@media(max-width:480px){body{display:block;background:var(--bg)}.phone{width:100%;height:100%;border-radius:0;box-shadow:none}}
.status{position:absolute;top:0;left:0;right:0;height:46px;display:flex;justify-content:space-between;align-items:center;padding:6px 28px 0;font:800 14px/1 Nunito;z-index:60;pointer-events:none}
.status i{font-style:normal;font-size:11px;letter-spacing:1px}
main{position:absolute;inset:0;overflow-y:auto;padding:52px 0 104px;scrollbar-width:none}main::-webkit-scrollbar{display:none}
.screen{display:none;animation:fade .25s ease}.screen.on{display:block}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.pad{padding:0 18px}
/* top */
.top{display:flex;align-items:center;gap:12px;padding:6px 18px 14px}
.av{width:42px;height:42px;border-radius:50%;object-fit:cover;flex:none;background:var(--card2)}
.av.sm{width:34px;height:34px}.av.xs{width:26px;height:26px}
.hello small{display:block;color:var(--mut);font-size:12.5px;font-weight:700}
.hello b{font-size:19px;font-weight:900;letter-spacing:-.2px}
.ib{width:42px;height:42px;border-radius:14px;background:var(--card);display:grid;place-items:center;position:relative;flex:none}
.ib .dot{position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px var(--card)}
.sp{flex:1}
.loc{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);font-weight:700}.loc b{color:var(--teal)}
.lang{display:flex;background:var(--card);border-radius:12px;padding:3px}.lang button{padding:6px 9px;border-radius:9px;font:800 11px/1 'JetBrains Mono';color:var(--mut)}.lang button.on{background:var(--card2);color:var(--ink)}
.search{display:flex;align-items:center;gap:10px;margin:0 18px 18px;padding:14px 16px;border-radius:18px;background:var(--card);color:var(--mut);font-weight:700;width:calc(100% - 36px);text-align:left;border:1px solid var(--line)}
.search .f{margin-left:auto;width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff}
.h2{display:flex;align-items:baseline;justify-content:space-between;padding:0 18px;margin:22px 0 12px}.h2 h3{margin:0;font-size:18px;font-weight:900;letter-spacing:-.2px}.h2 button{color:var(--coral);font-weight:800;font-size:13px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 18px}
.cat{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px 10px;border-radius:18px;background:var(--card);font-size:11.5px;font-weight:800;border:1px solid var(--line);transition:.15s}
.cat:active{transform:scale(.95)}
.cat .ci{width:44px;height:44px;border-radius:14px;display:grid;place-items:center}
.cat .ci svg{width:22px;height:22px}
.banner{margin:0 18px;border-radius:22px;padding:16px;display:flex;gap:14px;align-items:center;background:linear-gradient(120deg,rgba(46,196,182,.18),rgba(46,196,182,.04));border:1px solid rgba(46,196,182,.3);text-align:left;width:calc(100% - 36px)}
.banner .bi{width:46px;height:46px;border-radius:14px;background:rgba(46,196,182,.2);color:var(--teal);display:grid;place-items:center;flex:none}
.banner b{display:block;font-size:14.5px;font-weight:900}.banner small{color:var(--mut);font-size:12.5px}
.toppro{margin:0 18px;border-radius:26px;overflow:hidden;position:relative;height:210px;display:block;width:calc(100% - 36px);text-align:left}
.toppro img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.toppro:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,16,32,.1),rgba(10,16,32,.92))}
.toppro .in{position:absolute;left:16px;right:16px;bottom:14px;z-index:2;display:flex;align-items:flex-end;gap:12px}
.toppro .tag{position:absolute;top:14px;left:14px;z-index:2;font:800 10.5px/1 'JetBrains Mono';letter-spacing:1px;text-transform:uppercase;background:var(--gold);color:#241a00;padding:6px 9px;border-radius:8px}
.toppro b{font-size:18px;font-weight:900;display:block}.toppro small{color:var(--mut);font-size:12.5px}
.rate{display:inline-flex;align-items:center;gap:4px;font:700 12.5px/1 'JetBrains Mono';color:var(--gold)}.rate svg{width:13px;height:13px;fill:var(--gold);stroke:none}
.rate span{color:var(--mut);font-weight:500}
.hlist{display:flex;gap:12px;overflow-x:auto;padding:0 18px 4px;scrollbar-width:none}.hlist::-webkit-scrollbar{display:none}
.pcard{flex:none;width:168px;border-radius:22px;background:var(--card);padding:12px;text-align:left;border:1px solid var(--line)}
.pcard .ph{position:relative}.pcard .ph img{width:100%;height:118px;border-radius:15px;object-fit:cover}
.pcard .ph .vf{position:absolute;top:8px;left:8px}
.pcard b{display:block;margin-top:10px;font-size:14.5px;font-weight:900}.pcard small{display:block;color:var(--mut);font-size:12px;margin:2px 0 8px}
.vf{display:inline-flex;align-items:center;gap:4px;font:800 10px/1 'JetBrains Mono';padding:5px 7px;border-radius:7px;background:rgba(46,196,182,.92);color:#032a26;letter-spacing:.5px;text-transform:uppercase}
.vf svg{width:11px;height:11px;stroke-width:3}
.chip{display:inline-flex;align-items:center;gap:5px;font:800 10.5px/1 'JetBrains Mono';padding:6px 8px;border-radius:8px;letter-spacing:.4px;text-transform:uppercase}
.st-pending{background:rgba(255,200,87,.15);color:var(--gold)}.st-confirmed{background:rgba(46,196,182,.16);color:var(--teal)}.st-onway,.st-progress{background:rgba(90,169,255,.16);color:var(--blue)}.st-done{background:rgba(61,220,151,.14);color:var(--ok)}.st-cancelled{background:rgba(255,255,255,.07);color:var(--dim)}
.next{margin:0 18px 6px;padding:14px;border-radius:22px;background:var(--card);display:flex;gap:12px;align-items:center;text-align:left;width:calc(100% - 36px);border:1px solid rgba(255,107,91,.35)}
.next .tm{width:52px;flex:none;text-align:center;border-radius:14px;background:var(--card2);padding:7px 0}.next .tm small{display:block;font:700 10px 'JetBrains Mono';color:var(--coral);text-transform:uppercase}.next .tm b{font-size:19px;font-weight:900}
.next b{font-weight:900}.next small{color:var(--mut);font-size:12.5px;display:block}
/* lists */
.row{display:flex;gap:12px;align-items:center;padding:12px;border-radius:20px;background:var(--card);margin:0 18px 10px;width:calc(100% - 36px);text-align:left;border:1px solid var(--line)}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .t small{display:block;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pr{text-align:right}.row .pr b{font:700 14px 'JetBrains Mono'}.row .pr small{display:block;color:var(--mut);font-size:11px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-radius:14px;padding:4px;margin:0 18px 14px}
.seg button{padding:9px 6px;border-radius:11px;font-weight:800;font-size:13px;color:var(--mut)}.seg button.on{background:var(--card2);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 18px 14px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:9px 14px;border-radius:12px;background:var(--card);font-weight:800;font-size:13px;color:var(--mut);border:1px solid var(--line)}.chips button.on{background:var(--ink);color:var(--bg)}
.empty{text-align:center;color:var(--mut);padding:40px 24px;font-weight:700}
.h1{font-size:28px;font-weight:900;letter-spacing:-.4px;padding:4px 18px 2px;margin:0}
.sub{color:var(--mut);padding:0 18px 16px;font-size:13.5px}
/* calendar */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 18px 16px}
.week button{padding:9px 0 8px;border-radius:14px;background:var(--card);text-align:center;border:1px solid var(--line)}.week button small{display:block;font:700 10px 'JetBrains Mono';color:var(--mut)}.week button b{display:block;font-size:16px;font-weight:900;margin:2px 0}.week button i{display:block;width:5px;height:5px;border-radius:50%;margin:0 auto;background:transparent}.week button.has i{background:var(--coral)}.week button.on{background:var(--coral);border-color:var(--coral)}.week button.on small{color:#fff}.week button.on i{background:#fff}
.bk{display:block;margin:0 18px 12px;width:calc(100% - 36px);text-align:left;background:var(--card);border-radius:22px;padding:14px;border:1px solid var(--line)}
.bk .hd{display:flex;align-items:center;gap:12px}.bk .hd .t{flex:1;min-width:0}.bk .hd b{display:block;font-weight:900}.bk .hd small{color:var(--mut);font-size:12.5px}
.bk .ft{display:flex;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut);font-weight:700;align-items:center}.bk .ft span{display:inline-flex;align-items:center;gap:6px}.bk .ft svg{width:15px;height:15px}
/* community */
.post{margin:0 18px 16px;background:var(--card);border-radius:24px;overflow:hidden;border:1px solid var(--line)}
.post .ph{display:flex;gap:10px;align-items:center;padding:12px 14px}.post .ph .t{flex:1;min-width:0}.post .ph b{font-weight:900;display:flex;align-items:center;gap:6px}.post .ph small{color:var(--mut);font-size:12px}
.badge{font:800 9.5px/1 'JetBrains Mono';padding:4px 6px;border-radius:6px;letter-spacing:.4px;text-transform:uppercase}.badge.pro{background:rgba(46,196,182,.18);color:var(--teal)}.badge.nb{background:rgba(255,200,87,.14);color:var(--gold)}
.media{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--card2);user-select:none;touch-action:pan-y}
.media img{width:100%;height:100%;object-fit:cover}
.ba .after{position:absolute;inset:0;clip-path:inset(0 0 0 var(--x,50%))}
.ba .handle{position:absolute;top:0;bottom:0;left:var(--x,50%);width:3px;background:#fff;transform:translateX(-50%);pointer-events:none}.ba .handle:after{content:"⟷";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:15px;font-weight:900}
.ba .lb{position:absolute;bottom:10px;font:800 10px/1 'JetBrains Mono';padding:5px 7px;border-radius:6px;background:rgba(0,0,0,.6);letter-spacing:.6px;text-transform:uppercase}.ba .lb.l{left:10px}.ba .lb.r{right:10px}
.post .tx{padding:12px 14px 4px;font-weight:600;color:#dfe4ee;font-size:14.5px}
.post .tagpro{margin:8px 14px 0;display:inline-flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:12px;background:var(--card2);font-size:12.5px;font-weight:800}
.post .acts{display:flex;align-items:center;gap:18px;padding:12px 14px 14px;color:var(--mut);font-weight:800;font-size:13px}.post .acts button{display:inline-flex;align-items:center;gap:6px}.post .acts button.on{color:var(--coral)}.post .acts button.on svg{fill:var(--coral);stroke:var(--coral)}
.post .acts .bkb{margin-left:auto;color:#fff;background:var(--grad);padding:8px 13px;border-radius:12px;font-size:12.5px}
.stars{display:inline-flex;gap:1px}.stars svg{width:14px;height:14px;fill:var(--gold);stroke:none}.stars svg.off{fill:#2a3550}
/* tab bar */
.tab{position:absolute;left:12px;right:12px;bottom:14px;height:70px;border-radius:26px;background:rgba(18,27,48,.94);backdrop-filter:blur(16px);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:40;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.45)}
.tab button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;font-weight:800;color:var(--dim);position:relative}.tab button svg{width:23px;height:23px}
.tab button.on{color:var(--ink)}.tab button.on svg{color:var(--coral)}
.tab .plus{width:54px;height:54px;border-radius:18px;background:var(--grad);color:#fff;display:grid;place-items:center;margin:0 auto;box-shadow:0 10px 26px rgba(255,107,91,.45)}.tab .plus svg{width:26px;height:26px}
.tab em{position:absolute;top:-4px;left:calc(50% + 6px);font:800 9.5px/1 'JetBrains Mono';font-style:normal;background:var(--coral);color:#fff;border-radius:99px;padding:3px 5px}
/* sheets */
.sheet{position:absolute;inset:0;z-index:80;display:none;background:rgba(3,6,14,.6);backdrop-filter:blur(3px)}.sheet.on{display:block}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--bg2);border-radius:30px 30px 0 0;padding:10px 18px 30px;animation:up .28s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}.panel::-webkit-scrollbar{display:none}
.panel.full{top:0;max-height:none;border-radius:0;padding:0 0 30px;background:var(--bg)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.grab{width:42px;height:5px;border-radius:5px;background:#2b3756;margin:2px auto 14px}
.phead{display:flex;align-items:center;gap:12px;margin-bottom:14px}.phead h2{margin:0;font-size:20px;font-weight:900;flex:1}
.nav{display:flex;align-items:center;gap:10px;padding:52px 18px 12px;position:sticky;top:0;background:linear-gradient(var(--bg) 75%,transparent);z-index:5}.nav h2{flex:1;margin:0;font-size:18px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav.over{position:absolute;left:0;right:0;background:none}
.nav.over .ib{background:rgba(10,16,32,.55);backdrop-filter:blur(10px)}
.lbl{font:800 11px 'JetBrains Mono';letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);margin:18px 2px 10px}
.fld{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;font-weight:700;font-size:14.5px;margin-bottom:10px;resize:none}.fld:focus{border-color:rgba(255,107,91,.6)}
.cta{width:100%;padding:16px;border-radius:18px;background:var(--grad);color:#fff;font-weight:900;font-size:16px;box-shadow:0 12px 28px rgba(255,107,91,.3)}
.cta[disabled]{opacity:.45;box-shadow:none}
.ghost{width:100%;padding:15px;border-radius:18px;background:var(--card);font-weight:900;font-size:15px;border:1px solid var(--line)}
.bar{position:sticky;bottom:-30px;padding:16px 18px 30px;margin:0 -18px -30px;background:linear-gradient(transparent,var(--bg) 26%);display:flex;gap:10px;z-index:4}
.panel.full .bar{margin:0;bottom:-30px}
.steps{display:flex;gap:6px;padding:0 18px 16px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--card2)}.steps i.on{background:var(--grad)}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:18px;background:var(--card);margin-bottom:9px;text-align:left;border:1.5px solid var(--line)}
.opt.on{border-color:var(--coral);background:rgba(255,107,91,.08)}
.opt .t{flex:1}.opt .t b{display:block;font-weight:900}.opt .t small{color:var(--mut);font-size:12.5px}
.opt .r{width:20px;height:20px;border-radius:50%;border:2px solid #34405f;flex:none}.opt.on .r{border:6px solid var(--coral)}
.opt .p{font:700 14px 'JetBrains Mono'}
.days{display:flex;gap:8px;overflow-x:auto;padding:0 0 4px;scrollbar-width:none;margin:0 -18px;padding:0 18px}.days::-webkit-scrollbar{display:none}
.day{flex:none;width:58px;padding:10px 0;border-radius:16px;background:var(--card);text-align:center;border:1.5px solid var(--line)}.day small{display:block;font:700 10px 'JetBrains Mono';color:var(--mut);text-transform:uppercase}.day b{display:block;font-size:19px;font-weight:900;margin-top:2px}.day.on{border-color:var(--coral);background:rgba(255,107,91,.1)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:12px 0;border-radius:14px;background:var(--card);font:700 13px 'JetBrains Mono';border:1.5px solid var(--line)}.slot.on{border-color:var(--coral);background:rgba(255,107,91,.1)}.slot.off{opacity:.3;text-decoration:line-through;pointer-events:none}
.ph3{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.ph3 button{aspect-ratio:1;border-radius:14px;overflow:hidden;position:relative;border:2px solid transparent;background:var(--card)}.ph3 button img{width:100%;height:100%;object-fit:cover}.ph3 button.on{border-color:var(--coral)}.ph3 button.on:after{content:"✓";position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:var(--coral);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:900}
.ph3 .add{display:grid;place-items:center;color:var(--mut);border:2px dashed #2b3756}
.sum{background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line)}.sum div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px;color:var(--mut);font-weight:700}.sum div b{color:var(--ink);text-align:right}.sum .tot{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;color:var(--ink);font-size:17px;font-weight:900}.sum .tot b{font-family:'JetBrains Mono'}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:rgba(46,196,182,.08);border:1px solid rgba(46,196,182,.25);color:#c7efe9;font-size:13px;margin-bottom:12px}.note svg{color:var(--teal);margin-top:1px}
/* pro profile */
.cover{height:250px;position:relative}.cover img{width:100%;height:100%;object-fit:cover}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,var(--bg))}
.pmain{padding:0 18px;margin-top:-56px;position:relative;z-index:2}
.pav{width:88px;height:88px;border-radius:28px;object-fit:cover;border:4px solid var(--bg)}
.pname{font-size:25px;font-weight:900;letter-spacing:-.3px;margin:10px 0 2px;display:flex;align-items:center;gap:8px}.pname svg{color:var(--teal);width:22px;height:22px}
.ptrade{color:var(--mut);font-weight:700}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.badges span{display:inline-flex;align-items:center;gap:5px;padding:7px 10px;border-radius:11px;font-weight:800;font-size:12px;background:var(--card);border:1px solid var(--line)}.badges svg{width:14px;height:14px}
.lic{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--card);font-size:13px;font-weight:700;color:var(--mut);border:1px solid var(--line)}.lic b{color:var(--ink)}.lic svg{color:var(--ok)}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.pstats div{background:var(--card);border-radius:16px;padding:12px 6px;text-align:center;border:1px solid var(--line)}.pstats b{display:block;font:700 16px 'JetBrains Mono'}.pstats small{color:var(--mut);font-size:10.5px;font-weight:800}
.svc{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--card);margin-bottom:8px;width:100%;text-align:left;border:1.5px solid var(--line)}.svc .t{flex:1}.svc b{display:block;font-weight:900}.svc small{color:var(--mut);font-size:12.5px}.svc .p{font:700 14px 'JetBrains Mono';text-align:right}.svc .p small{display:block;font-family:Nunito}

/* ============ sheets ============ */
function sheet(id,html,scrollTop=true){const sh=$('#sh-'+id),pn=sh.querySelector('.panel');if(sh.classList.contains('on')){pn.style.animation='none'}else{pn.style.animation=''}pn.innerHTML=html;if(scrollTop)pn.scrollTop=0;sh.classList.add('on')}
function closeSh(id){$('#sh-'+id).classList.remove('on')}
function closeAll(){['a','b','c','m'].forEach(closeSh)}
$('#sh-m').addEventListener('click',e=>{if(e.target.id==='sh-m')closeSh('m')});
function nav(title,onBack,right=''){return `<div class="nav"><button class="ib" onclick="${onBack}">${ic('back')}</button><h2>${title}</h2>${right}</div>`}

.sort((a,b)=>fsort==='top'?b.r-a.r||b.rv-a.rv:fsort==='near'?a.dist-b.dist:fsort==='price'?a.rate-b.rate:a.resp-b.resp);

<div class="chips"><button class="${!fcat?'on':''}" onclick="fcat=null;renderFind()">${t('all')}</button>${CATS.map(c=>`<button class="${fcat===c.k?'on':''}" onclick="fcat='${c.k}';renderFind()">${c[L]}</button>`).join('')}</div>

<div id="flist"></div>`;
sheet('a',html,!!first);renderFindList(list)}

$('#flist').innerHTML=`<div class="sub" style="padding-bottom:10px">${list.length} ${t('results')}</div>`+(list.length?list.map(p=>`<div class="row" onclick="openPro('${p.id}')" style="cursor:pointer"><img class="av" src="${U(p.av,120)}" alt="" style="width:54px;height:54px;border-radius:18px"><div class="t"><b>${p.n} <span style="color:var(--teal)">✓</span></b><small>${CAT[p.cat][L]} · ${p.area} · ${p.dist} mi</small><span class="rate" style="margin-top:4px">${ic(ICON.star)}${p.r} <span>(${p.rv}) · ${p.yrs} ${t('yrs')}${p.fast?' · ⚡':''}</span></span></div><div class="pr"><b>${money(p.rate)}</b><small>${t('hr')}</small><button class="chip" style="background:var(--grad);color:#fff;margin-top:6px" onclick="event.stopPropagation();openBook('${p.id}')">${t('book')}</button></div></div>`).join(''):`<div class="empty">${t('noResults')}</div>`)}

<div class="lbl">${t('availability')}</div><div class="avail">${days.map((d,i)=>`<div><small>${relD(d)}</small><b>${WINDOWS.filter((_,k)=>(k+i+p.yrs)%3!==0).slice(0,2).join(', ')}</b></div>`).join('')}</div>

<div style="height:8px"></div></div>

/* booking flow */
let B=null;
function openBook(id,svc){const p=PRO[id];B={pro:id,svc:svc??null,desc:'',photos:{},urg:'flex',day:p.today?0:1,w:null,addr:'1200 Brickell Bay Dr, #2104',access:'',promo:'',disc:0,pay:'apple',step:1};if(B.svc==null&&p.svc.length===1)B.svc=0;renderBook()}
function bkDays(){return Array.from({length:14},(_,i)=>addD(TODAY,i))}
function takenSlots(di){const p=PRO[B.pro];return WINDOWS.map((_,k)=>(k*7+di*3+p.yrs)%5===0||(di===0&&k<2))}
function est(){const p=PRO[B.pro],s=p.svc[B.svc];if(!s)return{labor:0,pri:0,disc:0,tot:0};const labor=s[2]==='hr'?s[1]*s[3]:s[1],pri=B.urg==='asap'?25:0,disc=Math.round((labor+pri)*B.disc),fee=0;return{labor,pri,disc,tot:labor+pri-disc+fee}}
function renderBook(keep){const p=PRO[B.pro],s=B.step;const steps=`<div class="steps">${[1,2,3].map(i=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>`;

function openArea(){sheet('m',`<div class="grab"></div><div class="phead"><h2>${t('neighborhood')}</h2><button class="ib" onclick="closeSh('m')">${ic('x')}</button></div>${AREAS.map(a=>`<button class="opt ${a===area?'on':''}" onclick="area='${a}';closeSh('m');go(tab)"><span class="r"></span><span class="t"><b>${a}</b><small>Miami</small></span></button>`).join('')}`)}
function openNotifs(){const n=[[PRO.carlos.av,{en:'<b>Carlos</b> confirmed tomorrow 10–12',es:'<b>Carlos</b> confirmó mañana de 10 a 12'},'2m',"openBooking('AS-4821')"],[PRO.sofia.av,{en:'<b>Sofía</b> posted a new accent wall',es:'<b>Sofía</b> publicó una nueva pared de acento'},'2h',"closeAll();go('community')"],[PRO.ana.av,{en:'How was your clean with <b>Ana</b>? Rate it',es:'¿Qué tal la limpieza con <b>Ana</b>? Califícala'},'1d',"openBooking('AS-4655')"],[NB.laura.av,{en:'<b>Laura</b> liked your review',es:'A <b>Laura</b> le gustó tu reseña'},'2d',"closeSh('m')"]];
sheet('m',`<div class="grab"></div><div class="phead"><h2>${t('notifs')}</h2><button class="ib" onclick="closeSh('m')">${ic('x')}</button></div>${n.map(x=>`<button class="row" style="margin:0 0 8px;width:100%" onclick="${x[3]}"><img class="av sm" src="${U(x[0],100)}" alt=""><div class="t"><small style="white-space:normal;color:var(--ink);font-size:13.5px">${tx(x[1])}</small><small>${x[2]}</small></div></button>`).join('')}`)}
function openApply(){sheet('m',`<div class="grab"></div><div class="phead"><h2>${t('applyTitle')}</h2><button class="ib" onclick="closeSh('m')">${ic('x')}</button></div>
<div class="note">${ic('gift')}<span>${t('applySub')}</span></div>
<input class="fld" id="apn" placeholder="${t('yourName')}"><select class="fld" id="apt">${CATS.map(c=>`<option value="${c.k}">${c[L]}</option>`).join('')}</select><input class="fld" placeholder="${t('licenseNo')}"><input class="fld" placeholder="${t('phone')}" inputmode="tel">
<button class="cta" onclick="if(!$('#apn').value.trim()){$('#apn').focus();return}closeSh('m');toast('✅ '+t('applied'))">${t('sendApp')}</button>`)}
function setLang(l){L=l;try{localStorage.setItem('as-lang',l)}catch(e){}document.documentElement.lang=l;const reopen=$('#sh-b').classList.contains('on')&&curBooking;closeAll();go(tab);if(reopen)openBooking(curBooking);toast(l==='es'?'Español 🇪🇸':'English 🇺🇸')}
window.addEventListener('message',e=>{const d=e.data||{};if(d.as==='lang'&&(d.v==='en'||d.v==='es')&&d.v!==L)setLang(d.v);if(d.as==='go')route(d.v)});
function route(s){closeAll();if(['home','bookings','community','inbox','profile'].includes(s))go(s);else if(s==='find')openFind();else if(s==='plumbing')openCat('plumbing');else if(s==='pro')openPro('carlos');else if(s==='book')openBook('carlos',0);else if(s==='track'){const b=bookings[0];b.st='onway';go('bookings');openBooking(b.id)}else if(s==='rate'){go('bookings');openBooking('AS-4655');setTimeout(()=>openRate('AS-4655'),300)}else if(s==='chat')openChat('carlos');else if(s==='apply')openApply()}
/* boot */
document.documentElement.lang=L;renderTab();go('home');const start=params.get('screen');if(start)route(start);
</script>
</body>
</html>
